version: 1.3.9

# 缓存设置，建议保持默认
cache: true

endpoints:
  google:
    vertex: true
    projectID: "evanyin-test"
    location: "us-central1"
    serviceKeyPath: ""
    models:
      default: [
        "gemini-3.1-pro-preview",
        "gemini-3.1-pro-preview-customtools",
        "gemini-3.1-flash-lite-preview",
        "gemini-2.5-pro",
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite"
      ]
      fetch: true # 设为 true 后，LibreChat 会尝试自动从 GCP 获取最新模型
    titleConvo: true # 自动为对话生成标题
